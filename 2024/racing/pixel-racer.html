<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Racer</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            margin: 0;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #game-container {
            width: 800px;
            height: 400px;
            background-color: #333;
            border: 2px solid #444;
            position: relative;
            overflow: hidden;
            margin: 20px auto;
        }
        .road {
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                #333 0px,
                #333 48px,
                #444 48px,
                #444 50px
            );
            animation: roadScroll 1s linear infinite;
        }
        @keyframes roadScroll {
            from { background-position: 0 0; }
            to { background-position: 0 50px; }
        }
        .car {
            width: 40px;
            height: 60px;
            position: absolute;
            bottom: 50px;
            left: 380px;
            background-color: #4CAF50;
            border-radius: 5px;
            transition: transform 0.1s;
        }
        .car::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 5px;
            right: 5px;
            height: 15px;
            background-color: #81C784;
            border-radius: 3px;
        }
        .car::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 0;
            right: 0;
            height: 10px;
            background: linear-gradient(90deg, #333 30%, transparent 30%, transparent 70%, #333 70%);
        }
        .obstacle {
            position: absolute;
            background-color: #f44336;
            border-radius: 3px;
        }
        .coin {
            width: 20px;
            height: 20px;
            position: absolute;
            background-color: #FFD700;
            border-radius: 50%;
            animation: coinRotate 0.5s linear infinite;
        }
        @keyframes coinRotate {
            from { transform: scale(1); }
            50% { transform: scale(0.8); }
            to { transform: scale(1); }
        }
        #score {
            font-size: 24px;
            margin: 10px;
        }
        #speed {
            font-size: 24px;
            margin: 10px;
            font-family: 'Courier New', monospace;
        }
        .game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            font-size: 24px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <h1>Pixel Racer</h1>
    <div id="score">Score: 0</div>
    <div id="speed">Speed: 0 MPH</div>
    <div id="game-container">
        <div class="road"></div>
        <div class="car"></div>
        <div class="game-over">
            Game Over!<br>
            Press Space to Restart
        </div>
    </div>

    <script>
        const container = document.getElementById('game-container');
        const car = document.querySelector('.car');
        const road = document.querySelector('.road');
        const scoreDisplay = document.getElementById('score');
        const speedDisplay = document.getElementById('speed');
        const gameOverScreen = document.querySelector('.game-over');

        let carX = 380;
        let score = 0;
        let speed = 5;
        let maxSpeed = 15;
        let acceleration = 0.1;
        let gameLoop;
        let obstacleInterval;
        let coinInterval;
        let obstacles = [];
        let coins = [];
        let keys = {};
        let isGameOver = false;

        function initGame() {
            // Reset variables
            carX = 380;
            score = 0;
            speed = 5;
            obstacles = [];
            coins = [];
            isGameOver = false;
            updateScore();
            updateSpeed();

            // Clear container
            const elementsToRemove = document.querySelectorAll('.obstacle, .coin');
            elementsToRemove.forEach(element => element.remove());

            // Reset car position
            car.style.left = carX + 'px';
            car.style.transform = 'rotate(0deg)';

            // Hide game over screen
            gameOverScreen.style.display = 'none';

            // Start game loops
            if (gameLoop) cancelAnimationFrame(gameLoop);
            if (obstacleInterval) clearInterval(obstacleInterval);
            if (coinInterval) clearInterval(coinInterval);

            gameLoop = requestAnimationFrame(updateGame);
            obstacleInterval = setInterval(createObstacle, 2000);
            coinInterval = setInterval(createCoin, 1000);

            // Set road animation speed
            road.style.animationDuration = (1 / speed) + 's';
        }

        function createObstacle() {
            if (isGameOver) return;

            const obstacle = document.createElement('div');
            obstacle.className = 'obstacle';
            const width = Math.random() * 60 + 40;
            const height = Math.random() * 40 + 20;
            obstacle.style.width = width + 'px';
            obstacle.style.height = height + 'px';
            obstacle.style.left = (Math.random() * (container.offsetWidth - width)) + 'px';
            obstacle.style.top = '-' + height + 'px';
            container.appendChild(obstacle);
            obstacles.push({
                element: obstacle,
                y: -height
            });
        }

        function createCoin() {
            if (isGameOver) return;

            const coin = document.createElement('div');
            coin.className = 'coin';
            coin.style.left = (Math.random() * (container.offsetWidth - 20)) + 'px';
            coin.style.top = '-20px';
            container.appendChild(coin);
            coins.push({
                element: coin,
                y: -20
            });
        }

        function updateGame() {
            if (isGameOver) return;

            // Update speed
            if (keys['ArrowUp'] && speed < maxSpeed) {
                speed += acceleration;
            } else if (!keys['ArrowUp'] && speed > 5) {
                speed -= acceleration;
            }
            updateSpeed();
            road.style.animationDuration = (1 / speed) + 's';

            // Move car
            if (keys['ArrowLeft']) {
                carX = Math.max(0, carX - (speed * 0.8));
                car.style.transform = 'rotate(-10deg)';
            } else if (keys['ArrowRight']) {
                carX = Math.min(container.offsetWidth - 40, carX + (speed * 0.8));
                car.style.transform = 'rotate(10deg)';
            } else {
                car.style.transform = 'rotate(0deg)';
            }
            car.style.left = carX + 'px';

            // Update obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obstacle = obstacles[i];
                obstacle.y += speed;
                obstacle.element.style.top = obstacle.y + 'px';

                // Check collision
                if (checkCollision(obstacle.element)) {
                    endGame();
                    return;
                }

                // Remove if off screen
                if (obstacle.y > container.offsetHeight) {
                    container.removeChild(obstacle.element);
                    obstacles.splice(i, 1);
                    score += 10;
                    updateScore();
                }
            }

            // Update coins
            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                coin.y += speed;
                coin.element.style.top = coin.y + 'px';

                // Check collection
                if (checkCollision(coin.element)) {
                    container.removeChild(coin.element);
                    coins.splice(i, 1);
                    score += 50;
                    updateScore();
                    continue;
                }

                // Remove if off screen
                if (coin.y > container.offsetHeight) {
                    container.removeChild(coin.element);
                    coins.splice(i, 1);
                }
            }

            gameLoop = requestAnimationFrame(updateGame);
        }

        function checkCollision(element) {
            const carRect = car.getBoundingClientRect();
            const elementRect = element.getBoundingClientRect();

            return !(carRect.right < elementRect.left || 
                    carRect.left > elementRect.right || 
                    carRect.bottom < elementRect.top || 
                    carRect.top > elementRect.bottom);
        }

        function updateScore() {
            scoreDisplay.textContent = `Score: ${score}`;
        }

        function updateSpeed() {
            speedDisplay.textContent = `Speed: ${Math.round(speed * 10)} MPH`;
        }

        function endGame() {
            isGameOver = true;
            gameOverScreen.style.display = 'block';
            gameOverScreen.innerHTML = `Final Score: ${score}<br>Press Space to Play Again`;
            cancelAnimationFrame(gameLoop);
            clearInterval(obstacleInterval);
            clearInterval(coinInterval);
        }

        // Event Listeners
        document.addEventListener('keydown', e => {
            keys[e.key] = true;
            if (e.key === ' ' && isGameOver) {
                initGame();
            }
        });
        document.addEventListener('keyup', e => keys[e.key] = false);

        // Start the game
        initGame();
    </script>
</body>
</html>
