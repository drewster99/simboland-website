<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Shooter</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            margin: 0;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #game-container {
            width: 800px;
            height: 400px;
            background-color: #2a2a2a;
            border: 2px solid #333;
            position: relative;
            overflow: hidden;
            margin: 20px auto;
        }
        .player {
            width: 32px;
            height: 32px;
            position: absolute;
            background-color: #4CAF50;
            image-rendering: pixelated;
        }
        .player::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #4CAF50, #45a049);
            clip-path: polygon(0 0, 100% 0, 100% 70%, 50% 100%, 0 70%);
        }
        .player::after {
            content: '';
            position: absolute;
            top: 20%;
            left: 20%;
            width: 60%;
            height: 30%;
            background: #2196F3;
            border-radius: 2px;
        }
        .enemy {
            width: 28px;
            height: 28px;
            position: absolute;
            background-color: #f44336;
            transform: translate(-50%, -50%);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
        }
        .bullet {
            width: 8px;
            height: 8px;
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        #score {
            font-size: 24px;
            margin: 10px;
        }
        .game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            font-size: 24px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <h1>Pixel Shooter</h1>
    <div id="score">Score: 0</div>
    <div id="game-container">
        <div class="player"></div>
        <div class="game-over">
            Game Over!<br>
            Click to Restart
        </div>
    </div>

    <script>
        const container = document.getElementById('game-container');
        let player = document.querySelector('.player');
        let gameOverScreen = document.querySelector('.game-over');
        const scoreDisplay = document.getElementById('score');

        let score = 0;
        let playerX = 400;
        let playerY = 200;
        let enemies = [];
        let bullets = [];
        let gameLoop;
        let spawnLoop;
        let gameOver = false;
        let keys = {};

        function initGame() {
            // Reset variables
            score = 0;
            playerX = 400;
            playerY = 200;
            enemies = [];
            bullets = [];
            gameOver = false;

            // Clear container
            container.innerHTML = `
                <div class="player"></div>
                <div class="game-over">Game Over!<br>Click to Restart</div>
            `;

            // Reset references
            player = document.querySelector('.player');
            gameOverScreen = document.querySelector('.game-over');

            // Update score
            updateScore();

            // Hide game over screen
            gameOverScreen.style.display = 'none';

            // Start game loops
            if (gameLoop) cancelAnimationFrame(gameLoop);
            if (spawnLoop) clearInterval(spawnLoop);
            
            gameLoop = requestAnimationFrame(updateGame);
            spawnLoop = setInterval(spawnEnemy, 2000);
        }

        function updateScore() {
            scoreDisplay.textContent = `Score: ${score}`;
        }

        function spawnEnemy() {
            if (gameOver) return;

            const side = Math.floor(Math.random() * 4);
            let x, y;

            switch(side) {
                case 0: // top
                    x = Math.random() * container.offsetWidth;
                    y = -20;
                    break;
                case 1: // right
                    x = container.offsetWidth + 20;
                    y = Math.random() * container.offsetHeight;
                    break;
                case 2: // bottom
                    x = Math.random() * container.offsetWidth;
                    y = container.offsetHeight + 20;
                    break;
                case 3: // left
                    x = -20;
                    y = Math.random() * container.offsetHeight;
                    break;
            }

            const enemy = document.createElement('div');
            enemy.className = 'enemy';
            enemy.style.left = x + 'px';
            enemy.style.top = y + 'px';
            container.appendChild(enemy);

            enemies.push({
                element: enemy,
                x: x,
                y: y,
                speed: 2
            });
        }

        function shoot() {
            if (gameOver) return;

            // Find closest enemy
            let closestEnemy = null;
            let closestDistance = Infinity;

            enemies.forEach(enemy => {
                const dx = enemy.x - playerX;
                const dy = enemy.y - playerY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < closestDistance) {
                    closestDistance = distance;
                    closestEnemy = enemy;
                }
            });

            if (closestEnemy) {
                const angle = Math.atan2(closestEnemy.y - playerY, closestEnemy.x - playerX);
                const bullet = document.createElement('div');
                bullet.className = 'bullet';
                bullet.style.left = playerX + 'px';
                bullet.style.top = playerY + 'px';
                container.appendChild(bullet);

                bullets.push({
                    element: bullet,
                    x: playerX,
                    y: playerY,
                    speed: 8,
                    angle: angle
                });
            }
        }

        function updateGame() {
            if (gameOver) return;

            // Move player
            const speed = 5;
            if (keys['ArrowUp'] || keys['w']) playerY = Math.max(16, playerY - speed);
            if (keys['ArrowDown'] || keys['s']) playerY = Math.min(container.offsetHeight - 16, playerY + speed);
            if (keys['ArrowLeft'] || keys['a']) playerX = Math.max(16, playerX - speed);
            if (keys['ArrowRight'] || keys['d']) playerX = Math.min(container.offsetWidth - 16, playerX + speed);

            player.style.left = (playerX - 16) + 'px';
            player.style.top = (playerY - 16) + 'px';

            // Auto-shoot
            if (enemies.length > 0) {
                shoot();
            }

            // Update bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                bullet.x += Math.cos(bullet.angle) * bullet.speed;
                bullet.y += Math.sin(bullet.angle) * bullet.speed;
                bullet.element.style.left = bullet.x + 'px';
                bullet.element.style.top = bullet.y + 'px';

                // Remove bullets that are off screen
                if (bullet.x < 0 || bullet.x > container.offsetWidth ||
                    bullet.y < 0 || bullet.y > container.offsetHeight) {
                    container.removeChild(bullet.element);
                    bullets.splice(i, 1);
                }
            }

            // Update enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                const angle = Math.atan2(playerY - enemy.y, playerX - enemy.x);
                enemy.x += Math.cos(angle) * enemy.speed;
                enemy.y += Math.sin(angle) * enemy.speed;
                enemy.element.style.left = enemy.x + 'px';
                enemy.element.style.top = enemy.y + 'px';

                // Check collision with player
                const dx = playerX - enemy.x;
                const dy = playerY - enemy.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < 24) {
                    endGame();
                    return;
                }

                // Check collision with bullets
                for (let j = bullets.length - 1; j >= 0; j--) {
                    const bullet = bullets[j];
                    const bdx = bullet.x - enemy.x;
                    const bdy = bullet.y - enemy.y;
                    const bulletDistance = Math.sqrt(bdx * bdx + bdy * bdy);

                    if (bulletDistance < 18) {
                        // Remove enemy and bullet
                        container.removeChild(enemy.element);
                        container.removeChild(bullet.element);
                        enemies.splice(i, 1);
                        bullets.splice(j, 1);
                        
                        // Update score
                        score += 10;
                        updateScore();
                        break;
                    }
                }
            }

            gameLoop = requestAnimationFrame(updateGame);
        }

        function endGame() {
            gameOver = true;
            cancelAnimationFrame(gameLoop);
            clearInterval(spawnLoop);
            gameOverScreen.style.display = 'block';
        }

        // Event Listeners
        document.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        container.addEventListener('click', e => {
            if (gameOver) {
                initGame();
            }
        });

        // Start the game
        initGame();
    </script>
</body>
</html>
