    background:rgba(0,0,0,0.35); border-bottom:1px solid rgba(255,255,255,0.07); flex-wrap:wrap; }

<body>
<div class="header"><a href="./">&larr; Simboland</a><h1>CASCADE</h1></div>
<div class="wrap">
    <div class="side">
        <div class="box"><h3>Hold</h3><canvas id="hold" width="150" height="90"></canvas></div>
        <div class="box"><h3>Score</h3><div class="v" id="score">0</div></div>
        <div class="box"><h3>Lines</h3><div class="v" id="lines">0</div></div>
        <div class="box"><h3>Level</h3><div class="v" id="level" style="color:#f472b6">1</div></div>
    </div>
    <canvas id="board" width="320" height="640"></canvas>
    <div class="side">
        <div class="box"><h3>Next</h3><canvas id="next" width="150" height="260"></canvas></div>
        <div class="box"><h3>Best</h3><div class="v" id="best" style="color:#ffe066">0</div></div>
        <div class="box help">
            <kbd>&larr;</kbd><kbd>&rarr;</kbd> move<br>
            <kbd>&uarr;</kbd> / <kbd>X</kbd> rotate<br>
            <kbd>Z</kbd> rotate back<br>
            <kbd>&darr;</kbd> soft drop<br>
            <kbd>Space</kbd> hard drop<br>
            <kbd>C</kbd> hold<br>
            <kbd>P</kbd> pause
        </div>
    </div>
</div>

    <div class="obox">
        <h2 id="ovTitle">CASCADE</h2>
        <p id="ovMsg">Clear lines, climb levels, keep the stack down. Four rows at once is a Cascade — worth eight times a single.</p>
        <button class="btn" id="ovBtn">Play</button>
    </div>

<script>
const COLS=10, ROWS=20, CELL=32;
const bc=document.getElementById('board'), bx=bc.getContext('2d');
const nc=document.getElementById('next'), nx=nc.getContext('2d');
const hc=document.getElementById('hold'), hx=hc.getContext('2d');

/* The seven shapes are the standard set of four-cell polyominoes. Each is
   stored as its cells at rotation 0; rotations are computed, not stored. */
const SHAPES={
    I:{cells:[[0,1],[1,1],[2,1],[3,1]],size:4,color:'#22d3ee'},
    O:{cells:[[1,0],[2,0],[1,1],[2,1]],size:4,color:'#facc15'},
    T:{cells:[[1,0],[0,1],[1,1],[2,1]],size:3,color:'#c084fc'},
    S:{cells:[[1,0],[2,0],[0,1],[1,1]],size:3,color:'#4ade80'},
    Z:{cells:[[0,0],[1,0],[1,1],[2,1]],size:3,color:'#f87171'},
    J:{cells:[[0,0],[0,1],[1,1],[2,1]],size:3,color:'#60a5fa'},
    L:{cells:[[2,0],[0,1],[1,1],[2,1]],size:3,color:'#fb923c'},
};
const KEYS=Object.keys(SHAPES);
const KICKS=[[0,0],[-1,0],[1,0],[-2,0],[2,0],[0,-1],[-1,-1],[1,-1]];

let ac=null;
function actx(){ if(!ac){const C=window.AudioContext||window.webkitAudioContext; if(C)ac=new C();} return ac; }
function snd(f0,f1,dur,type,vol){
    const a=actx(); if(!a) return;
    const o=a.createOscillator(), g=a.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(f0,a.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),a.currentTime+dur);
    g.gain.setValueAtTime(vol||0.04,a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur+0.02);
}

const BEST_KEY='cascadeBest';
let best=0; try{ best=parseInt(localStorage.getItem(BEST_KEY)||'0',10)||0; }catch(e){}
document.getElementById('best').textContent=best.toLocaleString();

let S;
function reset(){
    S={ grid:Array.from({length:ROWS},()=>Array(COLS).fill(null)),
        bag:[], next:[], piece:null, hold:null, held:false,
        score:0, lines:0, level:1, drop:0, dropRate:0.8, over:false, paused:false,
        flash:[], flashT:0, combo:0, started:false };
    for(let i=0;i<5;i++) S.next.push(pull());
    spawn();
    sync();
}
function pull(){
    if(!S.bag.length){ S.bag=KEYS.slice(); for(let i=S.bag.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1)); [S.bag[i],S.bag[j]]=[S.bag[j],S.bag[i]]; } }
    return S.bag.pop();
}
function rotated(key,rot){
    const sp=SHAPES[key], n=sp.size;
    let cells=sp.cells.map(c=>[c[0],c[1]]);
    for(let r=0;r<((rot%4)+4)%4;r++) cells=cells.map(([x,y])=>[n-1-y,x]);
    return cells;
}
function spawn(key){
    const k=key||S.next.shift();
    if(!key) S.next.push(pull());
    S.piece={key:k,rot:0,x:Math.floor((COLS-SHAPES[k].size)/2),y:-1};
    if(collides(S.piece)) gameOver();
}
function collides(p,dx,dy,rot){
    const cells=rotated(p.key,rot===undefined?p.rot:rot);
    for(const [cx,cy] of cells){
        const x=p.x+cx+(dx||0), y=p.y+cy+(dy||0);
        if(x<0||x>=COLS||y>=ROWS) return true;
        if(y>=0&&S.grid[y][x]) return true;
    }
    return false;
}
function lockPiece(){
    const p=S.piece;
    for(const [cx,cy] of rotated(p.key,p.rot)){
        const x=p.x+cx, y=p.y+cy;
        if(y<0){ gameOver(); return; }
        S.grid[y][x]=SHAPES[p.key].color;
    }
    snd(180,90,0.08,'triangle',0.04);
    clearLines();
    S.held=false;
    if(!S.over) spawn();
}
function clearLines(){
    const full=[];
    for(let y=0;y<ROWS;y++) if(S.grid[y].every(c=>c)) full.push(y);
    if(!full.length){ S.combo=0; return; }
    S.flash=full.slice(); S.flashT=0.22;
    for(const y of full){ S.grid.splice(y,1); S.grid.unshift(Array(COLS).fill(null)); }
    S.lines+=full.length;
    S.combo++;
    const table={1:100,2:300,3:500,4:800};
    S.score+=(table[full.length]||0)*S.level + (S.combo>1?(S.combo-1)*50:0);
    const newLevel=1+Math.floor(S.lines/10);
    if(newLevel>S.level){ S.level=newLevel; S.dropRate=Math.max(0.06,0.8*Math.pow(0.84,S.level-1));
        snd(700,1200,0.2,'sine',0.06); }
    snd(full.length===4?900:520, full.length===4?1500:760, 0.18,'square',0.05);
    sync();
}
function gameOver(){
    S.over=true;
    if(S.score>best){ best=S.score; try{localStorage.setItem(BEST_KEY,String(best));}catch(e){} }
    document.getElementById('ovTitle').textContent='STACK OUT';
    document.getElementById('ovMsg').innerHTML='Score <b>'+S.score.toLocaleString()+'</b> &middot; '+
        S.lines+' lines &middot; level '+S.level+'<br>Best <b>'+best.toLocaleString()+'</b>';
    document.getElementById('ovBtn').textContent='Again';
    document.getElementById('ov').classList.remove('hidden');
    snd(300,60,0.6,'sawtooth',0.07);
}
function ghostY(){
    let d=0;
    while(!collides(S.piece,0,d+1)) d++;
    return S.piece.y+d;
}
function hardDrop(){
    let d=0;
    while(!collides(S.piece,0,d+1)) d++;
    S.piece.y+=d; S.score+=d*2;
    snd(500,120,0.09,'square',0.045);
    lockPiece(); sync();
}
function doHold(){
    if(S.held) return;
    const cur=S.piece.key;
    if(S.hold){ const h=S.hold; S.hold=cur; spawn(h); }
    else { S.hold=cur; spawn(); }
    S.held=true; snd(420,600,0.08,'sine',0.04); sync();
}
function tryRotate(dir){
    const p=S.piece, target=p.rot+dir;
    for(const [kx,ky] of KICKS){
        if(!collides(p,kx,ky,target)){ p.x+=kx; p.y+=ky; p.rot=target;
            snd(600,760,0.05,'square',0.03); return; }
    }
}

window.addEventListener('keydown',e=>{
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
    if(!S||!S.started) return;
    if(e.key==='p'||e.key==='P'){ S.paused=!S.paused; return; }
    if(S.over||S.paused) return;
    if(e.key==='ArrowLeft'){ if(!collides(S.piece,-1,0)) S.piece.x--; }
    else if(e.key==='ArrowRight'){ if(!collides(S.piece,1,0)) S.piece.x++; }
    else if(e.key==='ArrowDown'){ if(!collides(S.piece,0,1)){ S.piece.y++; S.score++; S.drop=0; } }
    else if(e.key==='ArrowUp'||e.key==='x'||e.key==='X') tryRotate(1);
    else if(e.key==='z'||e.key==='Z') tryRotate(-1);
    else if(e.key===' ') hardDrop();
    else if(e.key==='c'||e.key==='C') doHold();
});

function step(dt){
    if(!S.started||S.over||S.paused) return;
    if(S.flashT>0){ S.flashT-=dt; if(S.flashT<=0) S.flash=[]; }
    S.drop+=dt;
    if(S.drop>=S.dropRate){
        S.drop=0;
        if(!collides(S.piece,0,1)) S.piece.y++;
        else lockPiece();
    }
}

function cellRect(g,x,y,color,size,alpha){
    const s=size||CELL;
    g.globalAlpha=alpha===undefined?1:alpha;
    g.fillStyle=color;
    g.fillRect(x+1,y+1,s-2,s-2);
    g.fillStyle='rgba(255,255,255,0.28)';
    g.fillRect(x+1,y+1,s-2,Math.max(2,s*0.16));
    g.fillStyle='rgba(0,0,0,0.28)';
    g.fillRect(x+1,y+s-Math.max(2,s*0.16)-1,s-2,Math.max(2,s*0.16));
    g.globalAlpha=1;
}

function draw(){
    bx.fillStyle='#0d0d20'; bx.fillRect(0,0,bc.width,bc.height);
    bx.strokeStyle='rgba(255,255,255,0.04)'; bx.lineWidth=1;
    bx.beginPath();
    for(let x=0;x<=COLS;x++){ bx.moveTo(x*CELL,0); bx.lineTo(x*CELL,ROWS*CELL); }
    for(let y=0;y<=ROWS;y++){ bx.moveTo(0,y*CELL); bx.lineTo(COLS*CELL,y*CELL); }
    bx.stroke();

    for(let y=0;y<ROWS;y++)
        for(let x=0;x<COLS;x++)
            if(S.grid[y][x]) cellRect(bx,x*CELL,y*CELL,S.grid[y][x]);

    if(S.flash.length){
        bx.fillStyle='rgba(255,255,255,'+(S.flashT/0.22*0.8).toFixed(2)+')';
        for(const y of S.flash) bx.fillRect(0,y*CELL,COLS*CELL,CELL);
    }

    if(S.piece&&!S.over){
        const gy=ghostY();
        for(const [cx,cy] of rotated(S.piece.key,S.piece.rot)){
            const x=S.piece.x+cx, y=gy+cy;
            if(y>=0) cellRect(bx,x*CELL,y*CELL,SHAPES[S.piece.key].color,CELL,0.18);
        }
        for(const [cx,cy] of rotated(S.piece.key,S.piece.rot)){
            const x=S.piece.x+cx, y=S.piece.y+cy;
            if(y>=0) cellRect(bx,x*CELL,y*CELL,SHAPES[S.piece.key].color);
        }
    }

    if(S.paused){
        bx.fillStyle='rgba(0,0,0,0.6)'; bx.fillRect(0,0,bc.width,bc.height);
        bx.fillStyle='#f472b6'; bx.font='bold 26px "Segoe UI"'; bx.textAlign='center';
        bx.fillText('PAUSED',bc.width/2,bc.height/2);
    }

    drawPreview(nx,nc,S.next.slice(0,4));
    drawPreview(hx,hc,S.hold?[S.hold]:[]);
}
function drawPreview(g,canvas,list){
    g.fillStyle='#0d0d20'; g.fillRect(0,0,canvas.width,canvas.height);
    const s=20;
    list.forEach((key,i)=>{
        const cells=rotated(key,0);
        const xs=cells.map(c=>c[0]), ys=cells.map(c=>c[1]);
        const w=(Math.max(...xs)-Math.min(...xs)+1)*s, h=(Math.max(...ys)-Math.min(...ys)+1)*s;
        const ox=(canvas.width-w)/2-Math.min(...xs)*s, oy=14+i*62-Math.min(...ys)*s;
        for(const [cx,cy] of cells) cellRect(g,ox+cx*s,oy+cy*s,SHAPES[key].color,s);
    });
}

function sync(){
    document.getElementById('score').textContent=S.score.toLocaleString();
    document.getElementById('lines').textContent=S.lines;
    document.getElementById('level').textContent=S.level;
    document.getElementById('best').textContent=best.toLocaleString();
}

document.getElementById('ovBtn').addEventListener('click',()=>{
    actx(); reset(); S.started=true;
    document.getElementById('ov').classList.add('hidden');
});

let last=performance.now();
function loop(now){
    const dt=Math.min(0.05,(now-last)/1000); last=now;
    step(dt); draw();
    requestAnimationFrame(loop);
}
reset(); requestAnimationFrame(loop);
</script>
