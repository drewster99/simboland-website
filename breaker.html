<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brick Breaker - Simboland</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a2e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }
        .header {
            width: 100%;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(0,0,0,0.3);
        }
        .header a {
            color: #ffe066;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .header a:hover { color: #fff; }
        .header h1 { font-size: 1.3rem; color: #e74c3c; }
        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .score-bar {
            display: flex;
            gap: 30px;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        .score-bar span { color: #aaa; }
        .score-bar .val { color: #e74c3c; font-weight: bold; }
        canvas {
            border: 2px solid #e74c3c;
            border-radius: 4px;
            background: #111;
            display: block;
            cursor: none;
            touch-action: none;
        }
        .controls {
            margin-top: 20px;
            text-align: center;
        }
        .controls p { color: #888; font-size: 0.85rem; margin-bottom: 10px; }
        .btn {
            padding: 10px 25px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-play {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: #fff;
        }
        .btn-play:hover { box-shadow: 0 0 20px rgba(231,76,60,0.5); }
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .overlay-box {
            background: #1a1a4e;
            border: 2px solid #e74c3c;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
        }
        .overlay-box h2 { font-size: 2rem; margin-bottom: 10px; color: #e74c3c; }
        .overlay-box p { color: #aaa; margin-bottom: 20px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="header">
    <a href="index.html">&larr; Back to Simboland</a>
    <h1>Brick Breaker</h1>
</div>

<div class="game-area">
    <div class="score-bar">
        <div><span>Score: </span><span class="val" id="score">0</span></div>
        <div><span>Lives: </span><span class="val" id="lives">3</span></div>
        <div><span>Level: </span><span class="val" id="level">1</span></div>
    </div>
    <canvas id="game" width="480" height="500"></canvas>
    <div class="controls">
        <p>Move mouse or touch to control paddle. Click to launch ball.</p>
        <button class="btn btn-play" id="startBtn">Start Game</button>
    </div>
</div>

<div class="overlay hidden" id="overlay">
    <div class="overlay-box">
        <h2 id="overlayTitle">Game Over!</h2>
        <p id="overlayMsg">Score: 0</p>
        <button class="btn btn-play" id="overlayBtn">Play Again</button>
    </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// Brick config
const BRICK_ROWS = 6;
const BRICK_COLS = 10;
const BRICK_W = 44;
const BRICK_H = 18;
const BRICK_PAD = 3;
const BRICK_TOP = 40;
const BRICK_LEFT = (W - (BRICK_COLS * (BRICK_W + BRICK_PAD) - BRICK_PAD)) / 2;

const PADDLE_W = 80;
const PADDLE_H = 12;
const BALL_R = 6;

const COLORS = ['#e74c3c', '#e67e22', '#f1c40f', '#2ecc71', '#3498db', '#9b59b6'];

let bricks, paddle, ball, score, lives, level, running, launched, animFrame;

function createBricks() {
    bricks = [];
    for (let r = 0; r < BRICK_ROWS; r++) {
        for (let c = 0; c < BRICK_COLS; c++) {
            bricks.push({
                x: BRICK_LEFT + c * (BRICK_W + BRICK_PAD),
                y: BRICK_TOP + r * (BRICK_H + BRICK_PAD),
                w: BRICK_W,
                h: BRICK_H,
                color: COLORS[r % COLORS.length],
                alive: true,
                hits: level >= 3 && r < 2 ? 2 : 1
            });
        }
    }
}

function init() {
    score = 0;
    lives = 3;
    level = 1;
    updateUI();
    resetLevel();
    document.getElementById('overlay').classList.add('hidden');
    running = true;
    loop();
}

function resetLevel() {
    createBricks();
    paddle = { x: W / 2 - PADDLE_W / 2, y: H - 30, w: PADDLE_W, h: PADDLE_H };
    ball = { x: W / 2, y: paddle.y - BALL_R - 1, dx: 3, dy: -3, r: BALL_R };
    launched = false;
    updateUI();
}

function updateUI() {
    document.getElementById('score').textContent = score;
    document.getElementById('lives').textContent = lives;
    document.getElementById('level').textContent = level;
}

function loop() {
    if (!running) return;
    update();
    draw();
    animFrame = requestAnimationFrame(loop);
}

function update() {
    if (!launched) {
        ball.x = paddle.x + paddle.w / 2;
        ball.y = paddle.y - ball.r - 1;
        return;
    }

    ball.x += ball.dx;
    ball.y += ball.dy;

    // Wall bounce
    if (ball.x - ball.r <= 0 || ball.x + ball.r >= W) {
        ball.dx = -ball.dx;
        ball.x = Math.max(ball.r, Math.min(W - ball.r, ball.x));
    }
    if (ball.y - ball.r <= 0) {
        ball.dy = -ball.dy;
        ball.y = ball.r;
    }

    // Bottom - lose life
    if (ball.y + ball.r >= H) {
        lives--;
        updateUI();
        if (lives <= 0) {
            endGame(false);
            return;
        }
        launched = false;
        return;
    }

    // Paddle collision
    if (ball.dy > 0 &&
        ball.y + ball.r >= paddle.y &&
        ball.y + ball.r <= paddle.y + paddle.h + 4 &&
        ball.x >= paddle.x &&
        ball.x <= paddle.x + paddle.w) {
        ball.dy = -Math.abs(ball.dy);
        // Angle based on hit position
        const hitPos = (ball.x - paddle.x) / paddle.w; // 0 to 1
        ball.dx = (hitPos - 0.5) * 8;
        // Ensure minimum vertical speed
        if (Math.abs(ball.dy) < 2) ball.dy = -2;
        ball.y = paddle.y - ball.r - 1;
    }

    // Brick collision
    for (const brick of bricks) {
        if (!brick.alive) continue;
        if (ball.x + ball.r > brick.x &&
            ball.x - ball.r < brick.x + brick.w &&
            ball.y + ball.r > brick.y &&
            ball.y - ball.r < brick.y + brick.h) {

            brick.hits--;
            if (brick.hits <= 0) {
                brick.alive = false;
                score += 10 * level;
            } else {
                brick.color = '#888';
                score += 5;
            }
            updateUI();

            // Determine bounce direction
            const overlapLeft = (ball.x + ball.r) - brick.x;
            const overlapRight = (brick.x + brick.w) - (ball.x - ball.r);
            const overlapTop = (ball.y + ball.r) - brick.y;
            const overlapBottom = (brick.y + brick.h) - (ball.y - ball.r);
            const minOverlapX = Math.min(overlapLeft, overlapRight);
            const minOverlapY = Math.min(overlapTop, overlapBottom);

            if (minOverlapX < minOverlapY) {
                ball.dx = -ball.dx;
            } else {
                ball.dy = -ball.dy;
            }
            break;
        }
    }

    // Check level complete
    if (bricks.every(b => !b.alive)) {
        level++;
        if (level > 5) {
            endGame(true);
        } else {
            resetLevel();
        }
    }

    // Speed cap
    const speed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
    const maxSpeed = 6 + level;
    if (speed > maxSpeed) {
        ball.dx = (ball.dx / speed) * maxSpeed;
        ball.dy = (ball.dy / speed) * maxSpeed;
    }
}

function draw() {
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, W, H);

    // Bricks
    for (const brick of bricks) {
        if (!brick.alive) continue;
        ctx.fillStyle = brick.color;
        ctx.shadowColor = brick.color;
        ctx.shadowBlur = 5;
        ctx.fillRect(brick.x, brick.y, brick.w, brick.h);
        ctx.shadowBlur = 0;

        // Highlight
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(brick.x, brick.y, brick.w, brick.h / 3);
    }

    // Paddle
    const grad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.h);
    grad.addColorStop(0, '#ddd');
    grad.addColorStop(1, '#888');
    ctx.fillStyle = grad;
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Ball
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    if (!launched && running) {
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Click or tap to launch', W / 2, H / 2);
    }
}

function endGame(won) {
    running = false;
    cancelAnimationFrame(animFrame);
    const overlay = document.getElementById('overlay');
    document.getElementById('overlayTitle').textContent = won ? 'You Win!' : 'Game Over!';
    document.getElementById('overlayMsg').textContent = 'Final Score: ' + score;
    document.getElementById('overlayBtn').textContent = 'Play Again';
    overlay.classList.remove('hidden');
}

// Input
canvas.addEventListener('mousemove', (e) => {
    if (!running) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    paddle.x = (e.clientX - rect.left) * scaleX - paddle.w / 2;
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
});

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (!running) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    paddle.x = (e.touches[0].clientX - rect.left) * scaleX - paddle.w / 2;
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
}, { passive: false });

canvas.addEventListener('click', () => {
    if (running && !launched) launched = true;
});

canvas.addEventListener('touchstart', (e) => {
    if (running && !launched) {
        launched = true;
        e.preventDefault();
    }
}, { passive: false });

document.getElementById('startBtn').addEventListener('click', init);
document.getElementById('overlayBtn').addEventListener('click', init);

// Initial static draw
paddle = { x: W / 2 - PADDLE_W / 2, y: H - 30, w: PADDLE_W, h: PADDLE_H };
ball = { x: W / 2, y: H - 30 - BALL_R - 1, dx: 0, dy: 0, r: BALL_R };
bricks = [];
running = false;
createBricks();
draw();
</script>

</body>
</html>
