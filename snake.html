<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake - Simboland</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a2e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            width: 100%;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(0,0,0,0.3);
        }
        .header a {
            color: #ffe066;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .header a:hover { color: #fff; }
        .header h1 {
            font-size: 1.3rem;
            color: #2ecc71;
        }
        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .score-bar {
            display: flex;
            gap: 30px;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        .score-bar span { color: #aaa; }
        .score-bar strong { color: #2ecc71; }
        canvas {
            border: 2px solid #2ecc71;
            border-radius: 4px;
            background: #111;
            display: block;
        }
        .controls {
            margin-top: 20px;
            text-align: center;
        }
        .controls p {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }
        .btn {
            padding: 10px 25px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-play {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: #fff;
        }
        .btn-play:hover { box-shadow: 0 0 20px rgba(46,204,113,0.5); }
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .overlay-box {
            background: #1a1a4e;
            border: 2px solid #2ecc71;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
        }
        .overlay-box h2 { font-size: 2rem; margin-bottom: 10px; color: #2ecc71; }
        .overlay-box p { color: #aaa; margin-bottom: 20px; }
        .hidden { display: none; }

        /* Mobile D-pad */
        .dpad {
            display: none;
            margin-top: 15px;
        }
        .dpad-row {
            display: flex;
            justify-content: center;
            gap: 5px;
        }
        .dpad-btn {
            width: 60px;
            height: 60px;
            background: rgba(46,204,113,0.2);
            border: 2px solid #2ecc71;
            border-radius: 12px;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .dpad-btn:active { background: rgba(46,204,113,0.5); }
        .dpad-spacer { width: 60px; height: 60px; }

        @media (max-width: 600px) {
            canvas { max-width: 95vw; max-height: 50vh; }
            .dpad { display: block; }
        }
    </style>
</head>
<body>

<div class="header">
    <a href="index.html">&larr; Back to Simboland</a>
    <h1>Snake</h1>
</div>

<div class="game-area">
    <div class="score-bar">
        <div><span>Score: </span><strong id="score">0</strong></div>
        <div><span>Best: </span><strong id="best">0</strong></div>
    </div>
    <canvas id="game" width="400" height="400"></canvas>
    <div class="controls">
        <p>Arrow keys or WASD to move. Space to pause.</p>
        <button class="btn btn-play" id="startBtn">Start Game</button>
        <div class="dpad">
            <div class="dpad-row">
                <div class="dpad-spacer"></div>
                <button class="dpad-btn" data-dir="up">&#9650;</button>
                <div class="dpad-spacer"></div>
            </div>
            <div class="dpad-row">
                <button class="dpad-btn" data-dir="left">&#9664;</button>
                <button class="dpad-btn" data-dir="down">&#9660;</button>
                <button class="dpad-btn" data-dir="right">&#9654;</button>
            </div>
        </div>
    </div>
</div>

<div class="overlay" id="gameOverOverlay">
    <div class="overlay-box">
        <h2>Game Over!</h2>
        <p>Your score: <strong id="finalScore">0</strong></p>
        <button class="btn btn-play" id="restartBtn">Play Again</button>
    </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const GRID = 20;
const COLS = canvas.width / GRID;
const ROWS = canvas.height / GRID;

let snake, direction, nextDirection, food, score, bestScore, gameLoop, running, paused;

// Sound effects via Web Audio API
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playEatSound() {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.15);
}

function playDeathSound() {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.5);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.5);
}

bestScore = parseInt(localStorage.getItem('snake_best') || '0');
document.getElementById('best').textContent = bestScore;
document.getElementById('gameOverOverlay').classList.add('hidden');

function init() {
    snake = [{ x: Math.floor(COLS / 2), y: Math.floor(ROWS / 2) }];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0;
    document.getElementById('score').textContent = score;
    placeFood();
    running = true;
    paused = false;
    document.getElementById('gameOverOverlay').classList.add('hidden');
    if (gameLoop) clearInterval(gameLoop);
    gameLoop = setInterval(update, 120);
    draw();
}

function placeFood() {
    let pos;
    do {
        pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
}

function update() {
    if (paused) return;
    direction = { ...nextDirection };
    const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

    // Wall collision
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        gameOver();
        return;
    }

    // Self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver();
        return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
        score++;
        document.getElementById('score').textContent = score;
        playEatSound();
        placeFood();
    } else {
        snake.pop();
    }

    draw();
}

function draw() {
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid lines (subtle)
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= canvas.width; x += GRID) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y <= canvas.height; y += GRID) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    // Food
    ctx.fillStyle = '#e74c3c';
    ctx.shadowColor = '#e74c3c';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Snake
    snake.forEach((seg, i) => {
        const ratio = 1 - i / snake.length;
        const g = Math.floor(150 + ratio * 105);
        ctx.fillStyle = `rgb(30, ${g}, 60)`;
        ctx.shadowColor = '#2ecc71';
        ctx.shadowBlur = i === 0 ? 8 : 0;
        const pad = i === 0 ? 1 : 2;
        ctx.fillRect(seg.x * GRID + pad, seg.y * GRID + pad, GRID - pad * 2, GRID - pad * 2);
        ctx.shadowBlur = 0;
    });

    // Eyes on head
    if (snake.length > 0) {
        const h = snake[0];
        ctx.fillStyle = '#fff';
        const ex1 = h.x * GRID + 6 + direction.x * 3;
        const ey1 = h.y * GRID + 6 + direction.y * 3;
        const ex2 = h.x * GRID + 13 + direction.x * 3;
        const ey2 = h.y * GRID + 13 + direction.y * 3;
        ctx.beginPath(); ctx.arc(ex1, ey1, 2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(ex2, ey2, 2, 0, Math.PI * 2); ctx.fill();
    }

    if (paused) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = '28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
    }
}

function gameOver() {
    running = false;
    clearInterval(gameLoop);
    playDeathSound();
    if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('snake_best', bestScore.toString());
        document.getElementById('best').textContent = bestScore;
    }
    document.getElementById('finalScore').textContent = score;
    document.getElementById('gameOverOverlay').classList.remove('hidden');
}

// Input
document.addEventListener('keydown', (e) => {
    if (!running && e.key !== ' ') return;
    switch (e.key) {
        case 'ArrowUp': case 'w': case 'W':
            if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
            e.preventDefault(); break;
        case 'ArrowDown': case 's': case 'S':
            if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
            e.preventDefault(); break;
        case 'ArrowLeft': case 'a': case 'A':
            if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
            e.preventDefault(); break;
        case 'ArrowRight': case 'd': case 'D':
            if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
            e.preventDefault(); break;
        case ' ':
            if (running) { paused = !paused; draw(); }
            e.preventDefault(); break;
    }
});

// D-pad
document.querySelectorAll('.dpad-btn').forEach(btn => {
    btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (!running) return;
        const dir = btn.dataset.dir;
        if (dir === 'up' && direction.y !== 1) nextDirection = { x: 0, y: -1 };
        if (dir === 'down' && direction.y !== -1) nextDirection = { x: 0, y: 1 };
        if (dir === 'left' && direction.x !== 1) nextDirection = { x: -1, y: 0 };
        if (dir === 'right' && direction.x !== -1) nextDirection = { x: 1, y: 0 };
    });
});

document.getElementById('startBtn').addEventListener('click', init);
document.getElementById('restartBtn').addEventListener('click', init);

// Initial draw
snake = [{ x: Math.floor(COLS / 2), y: Math.floor(ROWS / 2) }];
direction = { x: 1, y: 0 };
nextDirection = { x: 1, y: 0 };
food = { x: 5, y: 5 };
running = false;
draw();
</script>

</body>
</html>
