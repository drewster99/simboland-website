<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuse - Simboland</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a2e;color:#fff;font-family:'Segoe UI',Tahoma,sans-serif;min-height:100vh;user-select:none;-webkit-user-select:none}
.header{width:100%;padding:12px 24px;display:flex;align-items:center;gap:20px;background:rgba(0,0,0,.35);border-bottom:1px solid rgba(255,255,255,.07);flex-wrap:wrap}
.header a{color:#ffe066;text-decoration:none;font-size:.85rem}.header a:hover{color:#fff}
.header h1{font-size:1.25rem;color:#f59e0b;letter-spacing:2px}
.wrap{display:flex;flex-direction:column;align-items:center;padding:16px;gap:14px}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.chip{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:7px 16px;font-size:.85rem;font-variant-numeric:tabular-nums}
.chip b{color:#f59e0b;font-size:1.05rem}
.btn{padding:8px 18px;border:none;border-radius:20px;font-weight:600;cursor:pointer;font-family:inherit;font-size:.85rem;background:linear-gradient(135deg,#f59e0b,#b45309);color:#2a1600}
.btn:hover{box-shadow:0 0 16px rgba(245,158,11,.45)}
canvas{background:#1b2038;border-radius:14px;border:2px solid rgba(255,255,255,.08);display:block;max-width:94vw;height:auto;touch-action:none}
.help{color:#7a7a9a;font-size:.8rem;text-align:center;line-height:1.6}
kbd{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:1px 6px;font-size:.75rem;font-family:'SF Mono',monospace}
.overlay{position:fixed;inset:0;background:rgba(4,6,20,.85);display:flex;align-items:center;justify-content:center;z-index:60}
.overlay.hidden{display:none}
.obox{background:#2a1f0c;border:2px solid #f59e0b;border-radius:18px;padding:32px 40px;text-align:center;max-width:400px}
.obox h2{font-size:1.85rem;margin-bottom:8px;color:#f59e0b;letter-spacing:2px}
.obox p{color:#d8c39a;margin-bottom:18px;line-height:1.6;font-size:.92rem}
footer{text-align:center;padding:20px;color:rgba(255,255,255,.22);font-size:.8rem}
</style></head>
<body>
<div class="header"><a href="index.html">&larr; Simboland</a><h1>FUSE</h1></div>
<div class="wrap">
  <div class="bar">
    <div class="chip">Score <b id="score">0</b></div>
    <div class="chip">Best <b id="best">0</b></div>
    <div class="chip">Top tile <b id="top">2</b></div>
    <button class="btn" id="newBtn">New Game</button>
  </div>
  <canvas id="game" width="480" height="480"></canvas>
  <p class="help"><kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&rarr;</kbd><kbd>&darr;</kbd> or <kbd>WASD</kbd> to slide everything &mdash; or swipe.<br>
     Equal tiles merge. Get to <b>2048</b>, then keep going.</p>
</div>
<div class="overlay hidden" id="ov"><div class="obox">
  <h2 id="ovTitle">No Moves Left</h2><p id="ovMsg"></p>
  <button class="btn" id="ovBtn">Try Again</button>
</div></div>
<footer><p>&copy; 2026 Simboland</p></footer>
<script>
const N=4, PAD=14, cv=document.getElementById('game'), ctx=cv.getContext('2d');
const CELL=(cv.width-PAD*(N+1))/N;
const TILE={2:['#eee4da','#776e65'],4:['#ede0c8','#776e65'],8:['#f2b179','#fff'],16:['#f59563','#fff'],
32:['#f67c5f','#fff'],64:['#f65e3b','#fff'],128:['#edcf72','#fff'],256:['#edcc61','#fff'],
512:['#edc850','#fff'],1024:['#edc53f','#fff'],2048:['#edc22e','#fff'],4096:['#3c3a32','#fff'],8192:['#2b2a26','#fff']};
let ac=null;
function actx(){if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(C)ac=new C();}return ac;}
function snd(f0,f1,d,t,v){const a=actx();if(!a)return;const o=a.createOscillator(),g=a.createGain();
o.type=t||'sine';o.frequency.setValueAtTime(f0,a.currentTime);
o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),a.currentTime+d);
g.gain.setValueAtTime(v||.04,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);
o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+.02);}

let best=0; try{best=parseInt(localStorage.getItem('fuseBest')||'0',10)||0;}catch(e){}
let g,score,over,won,anim;

function reset(){
  g=Array.from({length:N},()=>Array(N).fill(0));
  score=0; over=false; won=false; anim=[];
  add(); add();
  document.getElementById('ov').classList.add('hidden');
  sync();
}
function add(){
  const free=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++) if(!g[y][x]) free.push([x,y]);
  if(!free.length) return;
  const [x,y]=free[Math.floor(Math.random()*free.length)];
  g[y][x]=Math.random()<0.9?2:4;
  anim.push({x,y,t:0.18,kind:'spawn'});
}
function rowSlide(row){
  const vals=row.filter(v=>v);
  const out=[]; let gained=0;
  for(let i=0;i<vals.length;i++){
    if(vals[i]===vals[i+1]){ out.push(vals[i]*2); gained+=vals[i]*2; i++; }
    else out.push(vals[i]);
  }
  while(out.length<N) out.push(0);
  return {out,gained};
}
function move(dir){
  if(over) return false;
  const before=JSON.stringify(g);
  let gained=0;
  const get=(i,j)=>{ // i = line index, j = position along the line
    if(dir==='left') return g[i][j];
    if(dir==='right') return g[i][N-1-j];
    if(dir==='up') return g[j][i];
    return g[N-1-j][i];
  };
  const set=(i,j,v)=>{
    if(dir==='left') g[i][j]=v;
    else if(dir==='right') g[i][N-1-j]=v;
    else if(dir==='up') g[j][i]=v;
    else g[N-1-j][i]=v;
  };
  for(let i=0;i<N;i++){
    const line=[]; for(let j=0;j<N;j++) line.push(get(i,j));
    const r=rowSlide(line); gained+=r.gained;
    for(let j=0;j<N;j++) set(i,j,r.out[j]);
  }
  if(JSON.stringify(g)===before) return false;
  score+=gained;
  if(gained) snd(300+Math.min(900,gained*3),520,.08,'sine',.04);
  else snd(240,200,.05,'sine',.02);
  add();
  if(!won&&g.some(r=>r.some(v=>v>=2048))){ won=true; showEnd(true); }
  if(!canMove()) showEnd(false);
  sync();
  return true;
}
function canMove(){
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    if(!g[y][x]) return true;
    if(x<N-1&&g[y][x]===g[y][x+1]) return true;
    if(y<N-1&&g[y][x]===g[y+1][x]) return true;
  }
  return false;
}
function showEnd(victory){
  if(victory){
    document.getElementById('ovTitle').textContent='2048';
    document.getElementById('ovTitle').style.color='#edc22e';
    document.getElementById('ovMsg').innerHTML='You made it, with <b>'+score.toLocaleString()+'</b> points.<br>Keep going for a bigger tile.';
    document.getElementById('ovBtn').textContent='Keep Playing';
    document.getElementById('ov').classList.remove('hidden');
    for(let i=0;i<5;i++) setTimeout(()=>snd(500+i*160,900+i*180,.2,'sine',.05),i*120);
  } else {
    over=true;
    if(score>best){best=score;try{localStorage.setItem('fuseBest',String(best));}catch(e){}}
    document.getElementById('ovTitle').textContent='NO MOVES LEFT';
    document.getElementById('ovTitle').style.color='#f87171';
    document.getElementById('ovMsg').innerHTML='Score <b>'+score.toLocaleString()+'</b> &middot; best <b>'+best.toLocaleString()+'</b>';
    document.getElementById('ovBtn').textContent='Try Again';
    document.getElementById('ov').classList.remove('hidden');
    snd(300,80,.5,'sawtooth',.06);
  }
}
window.addEventListener('keydown',e=>{
  const m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',
           a:'left',d:'right',w:'up',s:'down',A:'left',D:'right',W:'up',S:'down'}[e.key];
  if(m){ e.preventDefault(); actx(); move(m); }
});
let tsx=0,tsy=0;
cv.addEventListener('touchstart',e=>{tsx=e.touches[0].clientX;tsy=e.touches[0].clientY;actx();},{passive:true});
cv.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tsx, dy=e.changedTouches[0].clientY-tsy;
  if(Math.abs(dx)<24&&Math.abs(dy)<24) return;
  move(Math.abs(dx)>Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up'));
},{passive:true});

function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
 ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function draw(){
  ctx.fillStyle='#1b2038'; roundRect(0,0,cv.width,cv.height,14); ctx.fill();
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const px=PAD+x*(CELL+PAD), py=PAD+y*(CELL+PAD);
    ctx.fillStyle='rgba(255,255,255,.05)'; roundRect(px,py,CELL,CELL,8); ctx.fill();
    const v=g[y][x];
    if(!v) continue;
    const a=anim.find(a=>a.x===x&&a.y===y);
    const k=a?1+Math.sin((1-a.t/0.18)*Math.PI)*0.12:1;
    const s=CELL*k, o=(CELL-s)/2;
    const col=TILE[v]||['#3c3a32','#fff'];
    ctx.fillStyle=col[0]; roundRect(px+o,py+o,s,s,8); ctx.fill();
    ctx.fillStyle=col[1];
    const len=String(v).length;
    ctx.font='bold '+Math.round(CELL*(len>3?0.30:len>2?0.36:0.44))+'px "Segoe UI"';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(String(v),px+CELL/2,py+CELL/2+2);
  }
}
function sync(){
  document.getElementById('score').textContent=score.toLocaleString();
  document.getElementById('best').textContent=Math.max(best,score).toLocaleString();
  let t=2; for(const r of g) for(const v of r) if(v>t) t=v;
  document.getElementById('top').textContent=t;
}
document.getElementById('newBtn').addEventListener('click',()=>{actx();reset();});
document.getElementById('ovBtn').addEventListener('click',()=>{
  if(over) reset(); else document.getElementById('ov').classList.add('hidden');
});
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 for(const a of anim) a.t-=dt; anim=anim.filter(a=>a.t>0);
 draw(); requestAnimationFrame(loop);}
reset(); requestAnimationFrame(loop);
</script></body></html>
