<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simboland - Welcome to Our World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            background: #0a0a2e;
            color: #fff;
        }

        /* Landscape Scene */
        .landscape {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(180deg, #0d1b3e 0%, #1a2a5e 20%, #2d4a8e 40%, #4a7ab5 60%, #7ab5d4 75%, #3d8b37 75.1%, #2d6b2a 85%, #1d4b1d 100%);
        }

        /* Stars */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* Sun/Moon */
        .sun {
            position: absolute;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #ffe066, #ffb347);
            border-radius: 50%;
            top: 12%;
            right: 20%;
            box-shadow: 0 0 60px 20px rgba(255, 200, 50, 0.4);
            z-index: 2;
        }

        /* Clouds */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 50px;
            z-index: 3;
        }

        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: 50%;
        }

        .cloud-1 {
            width: 120px;
            height: 40px;
            top: 18%;
            left: 10%;
            animation: float-cloud 30s linear infinite;
        }

        .cloud-1::before { width: 50px; height: 50px; top: -25px; left: 20px; }
        .cloud-1::after { width: 60px; height: 60px; top: -30px; left: 50px; }

        .cloud-2 {
            width: 150px;
            height: 45px;
            top: 25%;
            left: 50%;
            animation: float-cloud 40s linear infinite;
        }

        .cloud-2::before { width: 60px; height: 60px; top: -30px; left: 25px; }
        .cloud-2::after { width: 70px; height: 70px; top: -35px; left: 60px; }

        .cloud-3 {
            width: 100px;
            height: 35px;
            top: 15%;
            left: 70%;
            animation: float-cloud 35s linear infinite reverse;
        }

        .cloud-3::before { width: 45px; height: 45px; top: -22px; left: 15px; }
        .cloud-3::after { width: 50px; height: 50px; top: -25px; left: 45px; }

        @keyframes float-cloud {
            0% { transform: translateX(0); }
            100% { transform: translateX(100vw); }
        }

        /* Mountains */
        .mountains {
            position: absolute;
            bottom: 25%;
            width: 100%;
            z-index: 4;
        }

        .mountain {
            position: absolute;
            bottom: 0;
            width: 0;
            height: 0;
        }

        .mountain-1 {
            border-left: 200px solid transparent;
            border-right: 200px solid transparent;
            border-bottom: 250px solid #2a4a3a;
            left: -5%;
        }

        .mountain-2 {
            border-left: 300px solid transparent;
            border-right: 300px solid transparent;
            border-bottom: 350px solid #1e3a2e;
            left: 15%;
        }

        .mountain-3 {
            border-left: 250px solid transparent;
            border-right: 250px solid transparent;
            border-bottom: 300px solid #2a4a3a;
            right: 10%;
        }

        .mountain-4 {
            border-left: 350px solid transparent;
            border-right: 350px solid transparent;
            border-bottom: 400px solid #1e3a2e;
            right: -10%;
        }

        /* Snow caps */
        .snow-cap {
            position: absolute;
            bottom: 0;
            width: 0;
            height: 0;
        }

        .snow-cap-2 {
            border-left: 60px solid transparent;
            border-right: 60px solid transparent;
            border-bottom: 70px solid rgba(255,255,255,0.6);
            left: calc(15% + 240px);
            bottom: 280px;
            z-index: 5;
        }

        .snow-cap-4 {
            border-left: 70px solid transparent;
            border-right: 70px solid transparent;
            border-bottom: 80px solid rgba(255,255,255,0.6);
            right: calc(-10% + 280px);
            bottom: 320px;
            z-index: 5;
        }

        /* Civilization / City */
        .civilization {
            position: absolute;
            bottom: 25%;
            width: 100%;
            z-index: 6;
        }

        .building {
            position: absolute;
            bottom: 0;
            z-index: 6;
        }

        /* Castle */
        .castle {
            width: 80px;
            height: 120px;
            background: linear-gradient(180deg, #8b7355, #6b5335);
            left: 45%;
            bottom: 0;
            border-radius: 4px 4px 0 0;
        }

        .castle::before {
            content: '';
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 30px solid #a0522d;
        }

        .castle::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 35px;
            background: #3a2a15;
            border-radius: 10px 10px 0 0;
        }

        .tower {
            position: absolute;
            bottom: 0;
            background: linear-gradient(180deg, #9b8365, #7b6345);
        }

        .tower-1 {
            width: 30px;
            height: 140px;
            left: 42%;
        }

        .tower-1::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-bottom: 20px solid #c0392b;
        }

        .tower-2 {
            width: 30px;
            height: 150px;
            left: 52%;
        }

        .tower-2::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-bottom: 20px solid #c0392b;
        }

        /* Houses */
        .house {
            position: absolute;
            bottom: 0;
            background: #d4a574;
        }

        .house-1 { width: 40px; height: 35px; left: 30%; }
        .house-2 { width: 35px; height: 30px; left: 35%; }
        .house-3 { width: 45px; height: 40px; left: 58%; }
        .house-4 { width: 38px; height: 32px; left: 63%; }
        .house-5 { width: 42px; height: 36px; left: 38%; }

        .house::before {
            content: '';
            position: absolute;
            top: -15px;
            left: -5px;
            width: 0;
            height: 0;
            border-left: calc(50% + 5px) solid transparent;
            border-right: calc(50% + 5px) solid transparent;
            border-bottom: 15px solid #8b4513;
        }

        .house::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 15px;
            background: #5a3510;
        }

        /* Windows that glow */
        .window-glow {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffe066;
            box-shadow: 0 0 8px 2px rgba(255, 224, 102, 0.6);
            z-index: 7;
        }

        /* Trees */
        .trees {
            position: absolute;
            bottom: 0;
            width: 100%;
            z-index: 8;
        }

        .tree {
            position: absolute;
            bottom: 25vh;
        }

        .tree-trunk {
            width: 8px;
            height: 30px;
            background: #5a3a1a;
            margin: 0 auto;
        }

        .tree-top {
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 35px solid #2d5a1e;
            position: relative;
            left: -16px;
        }

        .tree-top::before {
            content: '';
            position: absolute;
            top: 15px;
            left: -25px;
            width: 0;
            height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-bottom: 40px solid #1e4a15;
        }

        /* Grass foreground */
        .grass {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 25vh;
            background: linear-gradient(180deg, #3d8b37 0%, #2d6b2a 40%, #1d5b1d 100%);
            z-index: 9;
        }

        /* Path/Road */
        .path {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 25vh;
            background: linear-gradient(180deg, #b8956a 0%, #a08050 100%);
            z-index: 10;
            clip-path: polygon(35% 0%, 65% 0%, 80% 100%, 20% 100%);
        }

        /* River */
        .river {
            position: absolute;
            bottom: 5vh;
            left: 0;
            width: 100%;
            height: 20px;
            background: linear-gradient(90deg, transparent 0%, rgba(100, 180, 255, 0.6) 20%, rgba(80, 160, 240, 0.7) 50%, rgba(100, 180, 255, 0.6) 80%, transparent 100%);
            z-index: 10;
            border-radius: 50%;
            transform: scaleX(1.2);
        }

        /* Welcome Content */
        .welcome-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 20;
            padding: 40px;
        }

        .welcome-content h1 {
            font-size: 4rem;
            font-weight: 800;
            text-shadow: 0 0 30px rgba(0,0,0,0.7), 0 4px 8px rgba(0,0,0,0.5);
            margin-bottom: 10px;
            letter-spacing: 6px;
            background: linear-gradient(135deg, #ffe066, #ffb347, #ff6b6b, #c471ed, #12c2e9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s ease-in-out infinite alternate;
        }

        @keyframes shimmer {
            0% { filter: brightness(1); }
            100% { filter: brightness(1.3); }
        }

        .welcome-content p {
            font-size: 1.3rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            margin-bottom: 30px;
            color: #e0e0ff;
            font-weight: 300;
        }

        .scroll-hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            text-align: center;
            animation: bounce 2s ease-in-out infinite;
        }

        .scroll-hint span {
            display: block;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 8px;
        }

        .scroll-arrow {
            width: 30px;
            height: 30px;
            border-right: 3px solid rgba(255,255,255,0.7);
            border-bottom: 3px solid rgba(255,255,255,0.7);
            transform: rotate(45deg);
            margin: 0 auto;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(15px); }
        }

        /* Games Section */
        .games-section {
            background: linear-gradient(180deg, #1d4b1d 0%, #0a0a2e 15%);
            padding: 70px 20px 90px;
            min-height: 100vh;
        }

        .games-section h2 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 8px;
            color: #ffe066;
            text-shadow: 0 0 20px rgba(255, 224, 102, 0.3);
            letter-spacing: 3px;
        }

        .games-sub {
            text-align: center;
            color: #8a8aaa;
            font-size: 0.95rem;
            margin-bottom: 28px;
        }
        .games-sub b { color: #fff; }

        .filters {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 36px;
        }
        .filters button {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.12);
            color: #9a9aba;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filters button:hover { color: #fff; background: rgba(255,255,255,0.1); }
        .filters button.on {
            background: linear-gradient(135deg, #ffe066, #ffb347);
            border-color: transparent;
            color: #2a1f00;
            font-weight: 600;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 22px;
            max-width: 1180px;
            margin: 0 auto;
        }

        .game-card {
            background: linear-gradient(160deg, rgba(255,255,255,0.09), rgba(255,255,255,0.02));
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px;
            padding: 0;
            text-align: left;
            transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .game-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 44px rgba(0,0,0,0.5);
            border-color: rgba(255,255,255,0.24);
        }

        .card-art {
            height: 118px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.1rem;
            position: relative;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .card-art::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 120%, rgba(255,255,255,0.16), transparent 65%);
        }

        .card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; flex: 1; }

        .tag {
            align-self: flex-start;
            font-size: 0.62rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 8px;
            margin-bottom: 9px;
        }

        .game-card h3 { font-size: 1.18rem; margin-bottom: 6px; color: #fff; }
        .game-card p {
            color: rgba(255,255,255,0.55);
            font-size: 0.85rem;
            line-height: 1.55;
            flex: 1;
            margin-bottom: 14px;
        }

        .game-card .play-btn {
            display: inline-block;
            align-self: flex-start;
            padding: 9px 24px;
            border-radius: 22px;
            font-weight: 600;
            font-size: 0.86rem;
            letter-spacing: 0.5px;
            color: #fff;
            transition: all 0.25s ease;
        }

        .badge-new {
            position: absolute;
            top: 10px; right: 10px;
            background: #ffe066;
            color: #2a1f00;
            font-size: 0.6rem;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 3px 8px;
            border-radius: 7px;
            z-index: 2;
        }

        /* Footer */
        footer {
            background: #050515;
            text-align: center;
            padding: 30px;
            color: rgba(255,255,255,0.3);
            font-size: 0.85rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .welcome-content h1 {
                font-size: 2.5rem;
                letter-spacing: 3px;
            }

            .welcome-content p {
                font-size: 1rem;
            }

            .games-section h2 {
                font-size: 1.8rem;
            }

            .games-grid {
                grid-template-columns: 1fr;
                gap: 25px;
                padding: 0 10px;
            }
        }
    </style>
</head>
<body>

<!-- Landscape Scene -->
<div class="landscape">
    <!-- Stars -->
    <div class="stars" id="stars"></div>

    <!-- Sun -->
    <div class="sun"></div>

    <!-- Clouds -->
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>

    <!-- Mountains -->
    <div class="mountains">
        <div class="mountain mountain-1"></div>
        <div class="mountain mountain-2"></div>
        <div class="mountain mountain-3"></div>
        <div class="mountain mountain-4"></div>
        <div class="snow-cap snow-cap-2"></div>
        <div class="snow-cap snow-cap-4"></div>
    </div>

    <!-- Civilization -->
    <div class="civilization">
        <div class="building tower tower-1"></div>
        <div class="building tower tower-2"></div>
        <div class="building castle"></div>
        <div class="building house house-1"></div>
        <div class="building house house-2"></div>
        <div class="building house house-3"></div>
        <div class="building house house-4"></div>
        <div class="building house house-5"></div>
    </div>

    <!-- Grass -->
    <div class="grass"></div>

    <!-- Path -->
    <div class="path"></div>

    <!-- River -->
    <div class="river"></div>

    <!-- Trees -->
    <div class="trees" id="trees"></div>

    <!-- Welcome -->
    <div class="welcome-content">
        <h1>SIMBOLAND</h1>
        <p>Welcome to our world. Explore, play, and have fun!</p>
    </div>

    <!-- Scroll hint -->
    <div class="scroll-hint">
        <span>Scroll to play</span>
        <div class="scroll-arrow"></div>
    </div>
</div>

<!-- Games Section -->
<section class="games-section" id="games">
    <h2>THE ARCADE</h2>
    <p class="games-sub">Every game here is <b>original</b>, <b>free</b>, and runs instantly in your browser. No downloads, no accounts.</p>
    <div class="filters" id="filters"></div>
    <div class="games-grid" id="grid"></div>
</section>

<footer>
    <p>&copy; 2026 Simboland. All rights reserved.</p>
</footer>

<script>
    // Generate stars
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 80; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 3 + 1;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 3 + 's';
        star.style.animationDuration = (Math.random() * 2 + 2) + 's';
        starsContainer.appendChild(star);
    }

    // Generate trees
    const treesContainer = document.getElementById('trees');
    const treePositions = [5, 12, 20, 25, 70, 75, 82, 90, 95];

        const tree = document.createElement('div');
        tree.className = 'tree';
        tree.style.left = pos + '%';
        tree.innerHTML = '<div class="tree-top"></div><div class="tree-trunk"></div>';
        treesContainer.appendChild(tree);
    });

          color:'#f59e0b', dark:'#b45309',
          desc:'Slide the board, merge matching tiles, chase 2048 and then keep going.' },
        { file:'driftfield.html', name:'Driftfield', icon:'\u2604\uFE0F', tag:'Action', cat:'action',
          color:'#cbd5e1', dark:'#64748b',
          desc:'Drifting rocks that split when you shoot them, momentum steering, and saucers that shoot back.' },
        { file:'crossing.html', name:'Crossing', icon:'\u{1F438}', tag:'Arcade', cat:'action',
          color:'#34d399', dark:'#059669',
          desc:'Hop the traffic, ride the logs, get five of yours home before the road gets you.' },
        { file:'reflex.html', name:'Reflex', icon:'\u{1F3AF}', tag:'Skill', cat:'action',
          color:'#fb7185', dark:'#be123c',
          desc:'Sixty seconds of targets. Measures your real reaction time in milliseconds.' },
        { file:'connect4.html', name:'Four In A Row', icon:'\u{1F534}', tag:'Strategy', cat:'strategy',
          color:'#facc15', dark:'#ca8a04',
          desc:'Drop discs against a computer that actually searches ahead. Three levels, and hard is hard.' },
        { file:'sequence.html', name:'Sequence', icon:'\u{1F3B5}', tag:'Memory', cat:'puzzle',
          color:'#e879f9', dark:'#a21caf',
          desc:'Watch the pattern, repeat it, watch it grow. Each pad has its own note.' },
        { file:'pool.html', name:'8-Ball Pool', icon:'\u{1F3B1}', tag:'Sports', cat:'action',
          color:'#3498db', dark:'#2980b9',
          desc:'Line up your shots and sink all your balls before your opponent does.' },
        { file:'breaker.html', name:'Brick Breaker', icon:'\u{1F9F1}', tag:'Arcade', cat:'action',
          color:'#e74c3c', dark:'#c0392b',
          desc:'Smash every brick with your ball and paddle. How many levels can you clear?' },
        { file:'snake.html', name:'Snake', icon:'\u{1F40D}', tag:'Arcade', cat:'action',
          color:'#2ecc71', dark:'#27ae60',
          desc:'Guide the snake, eat, grow longer. Do not hit the walls or yourself.' },
    ];
    const CATS = [
        { key:'all', label:'All Games' },
        { key:'action', label:'Action' },
        { key:'puzzle', label:'Puzzle' },
        { key:'strategy', label:'Strategy' },
        { key:'racing', label:'Racing' },
    ];
    let activeCat = 'all';

    function renderGames() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        const list = GAMES.filter(g => activeCat === 'all' || g.cat === activeCat);
        for (const g of list) {
            const a = document.createElement('a');
            a.className = 'game-card';
            a.href = g.file;
            a.innerHTML =
                (g.fresh ? '<span class="badge-new">NEW</span>' : '') +
                '<div class="card-art" style="background:linear-gradient(150deg,' + g.color + '33,' + g.dark + '11)">' +
                    '<span>' + g.icon + '</span>' +
                '</div>' +
                '<div class="card-body">' +
                    '<span class="tag" style="background:' + g.color + '22;color:' + g.color + '">' + g.tag + '</span>' +
                    '<h3>' + g.name + '</h3>' +
                    '<p>' + g.desc + '</p>' +
                    '<span class="play-btn" style="background:linear-gradient(135deg,' + g.color + ',' + g.dark + ')">PLAY NOW</span>' +
                '</div>';
            a.addEventListener('mouseenter', () => { a.style.borderColor = g.color + '88'; });
            a.addEventListener('mouseleave', () => { a.style.borderColor = ''; });
            grid.appendChild(a);
        }
        document.querySelector('.games-sub').innerHTML =
            'Every game here is <b>original</b>, <b>free</b>, and runs instantly in your browser. ' +
            'No downloads, no accounts. <b>' + GAMES.length + '</b> to play.';
    }
    function renderFilters() {
        const host = document.getElementById('filters');
        host.innerHTML = '';
        for (const c of CATS) {
            const n = c.key === 'all' ? GAMES.length : GAMES.filter(g => g.cat === c.key).length;
            const b = document.createElement('button');
            b.textContent = c.label + ' (' + n + ')';
            if (c.key === activeCat) b.className = 'on';
            b.addEventListener('click', () => { activeCat = c.key; renderFilters(); renderGames(); });
            host.appendChild(b);
        }
    }
    renderFilters();
    renderGames();

    // Smooth scroll
    document.querySelector('.scroll-hint').addEventListener('click', () => {
        document.getElementById('games').scrollIntoView({ behavior: 'smooth' });
    });
</script>

</body>
</html>
